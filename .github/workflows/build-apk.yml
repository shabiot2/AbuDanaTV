name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Bundle the interface fonts inside the APK so they work even offline
      - name: Fonts
        run: |
          d=app/src/main/assets/fonts
          mkdir -p $d
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL "$base/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf" -o $d/ReadexPro.ttf || echo "ReadexPro not found"
          curl -fsSL "$base/reemkufi/ReemKufi%5Bwght%5D.ttf" -o $d/ReemKufi.ttf || echo "ReemKufi not found"
          curl -fsSL "$base/arefruqaa/ArefRuqaa-Bold.ttf" -o $d/ArefRuqaa-Bold.ttf || echo "ArefRuqaa not found"
          find $d -type f -size -2k -delete
          ls -l $d

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Rename
        run: |
          cp app/build/outputs/apk/release/app-release.apk AbuDanaTV.apk
          cp AbuDanaTV.apk tv.apk

      # Publishes the APK as a GitHub Release so it gets a fixed direct link:
      # https://github.com/<user>/<repo>/releases/latest/download/AbuDanaTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AbuDanaTV ${{ github.run_number }}
          files: |
            AbuDanaTV.apk
            tv.apk
          make_latest: true
