plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abudana.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.abudana.tv'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
